name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  analyzer:
    name: Python analyzer (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  dashboard:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images (build)
    runs-on: ubuntu-latest
    needs: [go, analyzer, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Go image (receiver/worker/api)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: acr-go:ci
      - name: Build analyzer image
        uses: docker/build-push-action@v6
        with:
          context: ./analyzer
          push: false
          tags: acr-analyzer:ci
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./web/dashboard
          push: false
          tags: acr-dashboard:ci
