# Webhook receiver. Same Go image as worker/api; command selects the binary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  labels: { app: receiver }
spec:
  replicas: 2
  selector:
    matchLabels: { app: receiver }
  template:
    metadata:
      labels: { app: receiver }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: receiver
          image: ghcr.io/OWNER/acr-go:latest
          command: ["/receiver"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: acr-config }
            - secretRef: { name: acr-secrets }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: receiver
spec:
  selector: { app: receiver }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
