# React dashboard, served by nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: { app: dashboard }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/OWNER/acr-dashboard:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector: { app: dashboard }
  ports:
    - { name: http, port: 80, targetPort: 80 }
