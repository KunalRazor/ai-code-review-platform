# DO NOT commit real secrets. Template only. Prefer creating it with kubectl:
#
#   kubectl create secret generic acr-secrets \
#     --from-literal=GITHUB_WEBHOOK_SECRET=... \
#     --from-literal=GITHUB_TOKEN=... \
#     --from-literal=ANTHROPIC_API_KEY=...
#
# Only needed when OFFLINE="false" (real GitHub) and/or LLM_PROVIDER != mock.
apiVersion: v1
kind: Secret
metadata:
  name: acr-secrets
  labels:
    app.kubernetes.io/part-of: ai-code-review
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: "change-me"
  GITHUB_TOKEN: "github_pat_xxx"
  ANTHROPIC_API_KEY: "sk-ant-xxx"
