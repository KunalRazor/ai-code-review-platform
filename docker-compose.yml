# Full platform, offline by default: no GitHub account and no LLM API key needed.
#   docker compose up --build
# Then run the demo to enqueue a sample PR:
#   docker compose exec worker sh -c 'true'   # (worker is running)
#   make demo                                  # from the host, or see README
#
# Dashboard: http://localhost:5173   API: http://localhost:8081
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: acr
      POSTGRES_PASSWORD: acr
      POSTGRES_DB: acr
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  analyzer:
    build: ./analyzer
    environment:
      DATABASE_URL: postgres://acr:acr@postgres:5432/acr
      EMBEDDINGS_PROVIDER: hash
      LLM_PROVIDER: mock
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy

  receiver:
    build: .
    entrypoint: ["/receiver"]
    environment:
      OFFLINE: "true"
      PORT: "8080"
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["/worker"]
    environment:
      OFFLINE: "true"
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://acr:acr@postgres:5432/acr?sslmode=disable
      ANALYZER_URL: http://analyzer:9000
      MIN_CONFIDENCE: "0.5"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      analyzer:
        condition: service_started

  api:
    build: .
    entrypoint: ["/api"]
    environment:
      OFFLINE: "true"
      API_PORT: "8081"
      DATABASE_URL: postgres://acr:acr@postgres:5432/acr?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./web/dashboard
    ports:
      - "5173:80"
    depends_on:
      - api
